agents:
  players:
  - type: symbolic1
  - type: symbolic1
  - type: symbolic1
  - type: symbolic1
  - type: symbolic1
  - type: symbolic1
  prince:
    ablation:
      bayes_adapt: mixture
      belief_mode: distribution
      give_belief_state: true
      give_history: true
      give_memory: true
