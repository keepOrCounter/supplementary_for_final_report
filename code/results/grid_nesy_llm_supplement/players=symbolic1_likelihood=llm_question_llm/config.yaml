  max_retries: 3
  max_tokens: 6144
  model: qwen3.5-9b-ctx12288:latest
  reasoning_effort: high
  reasoning_history:
    enabled: true
  temperature: 0.5
  top_p: 0.9
logging:
  enabled: true
  output_dir: results/grid_nesy_llm_supplement
